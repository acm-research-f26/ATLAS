[project]
name = "atlas"
version = "0.1.0"
description = "Satellite imagery extraction, classification, and model evaluation for ATLAS"
readme = "README.md"
authors = [
    { name = "sajnabhandari", email = "bhandarisajna@yahoo.com" },
    { name = "kevinlam404", email = "kevinklam223@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.114",
    "botocore[crt]>=1.43.114",
    "earthengine-api>=1.7.45",
    "geopandas>=1.1.4",
    "huggingface-hub>=2.1.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy",
    "open-clip-torch>=3.3.0",
    "pandas>=3.0.6",
    "pillow",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[project.optional-dependencies]
sagemaker = ["sagemaker>=2.257.7,<3"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
